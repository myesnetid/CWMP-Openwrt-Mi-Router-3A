name: Build CWMP Package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential clang flex bison g++ gawk gcc-multilib \
          gettext git libncurses5-dev libssl-dev python3-distutils \
          rsync unzip zlib1g-dev file wget

    - name: Clone OpenWrt
      run: |
        git clone https://github.com/openwrt/openwrt.git
        cd openwrt
        git checkout v23.05.5

    - name: Update feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Configure target
      run: |
        cd openwrt
        cat <<EOF > .config
        CONFIG_TARGET_ramips=y
        CONFIG_TARGET_ramips_mt76x8=y
        CONFIG_TARGET_ramips_mt76x8_DEVICE_xiaomi_mi-router-3a=y
        CONFIG_PACKAGE_cwmp=y
        EOF
        make defconfig

    - name: Compile CWMP package
      run: |
        cd openwrt
        make package/cwmp/compile V=s -j$(nproc)

    - name: Upload IPK
      uses: actions/upload-artifact@v4
      with:
        name: cwmp-ipk
        path: openwrt/bin/packages/
